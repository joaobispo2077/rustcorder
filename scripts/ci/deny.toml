[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
unmaintained = "all"
unsound = "all"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
include-dev = true
confidence-threshold = 0.93
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "BSL-1.0"]

# Existing bundled font and decoder dependencies; future versions require review.
exceptions = [
    { name = "epaint_default_fonts", version = "=0.37.0", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
    { name = "symphonia", version = "=0.6.1", allow = ["MPL-2.0"] },
    { name = "symphonia-bundle-mp3", version = "=0.6.1", allow = ["MPL-2.0"] },
    { name = "symphonia-codec-pcm", version = "=0.6.1", allow = ["MPL-2.0"] },
    { name = "symphonia-core", version = "=0.6.1", allow = ["MPL-2.0"] },
    { name = "symphonia-format-riff", version = "=0.6.1", allow = ["MPL-2.0"] },
    { name = "symphonia-metadata", version = "=0.6.1", allow = ["MPL-2.0"] },
    { name = "whisper-rs", version = "=0.16.0", allow = ["Unlicense"] },
    { name = "whisper-rs-sys", version = "=0.15.0", allow = ["Unlicense"] },
]

[licenses.private]
ignore = true
