name: Mutation full
on:
  schedule:
    - cron: 0 6 * * 1
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: mutation-full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mutation_rust:
    name: Mutation Rust full
    runs-on: windows-2025
    # Allow cold Windows setup and evidence upload around the 60-minute engine limit.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - run: npm ci --prefix scripts/ci --omit=peer --ignore-scripts
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'scripts/ci/toolchain.json') }}-${{
            github.sha }}
          restore-keys: |
            native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'scripts/ci/toolchain.json') }}-
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/ci-tools
            target
      - name: Provision pinned Windows tools
        shell: pwsh
        run: ./scripts/ci/setup-windows.ps1 -Install
      - name: Run mutation-rust
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/ci.ps1 -Gate mutation-rust -Profile full -EvidenceDirectory "$pwd/.build/ci-evidence/mutation-rust"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: evidence-${{ github.run_id }}-${{ github.run_attempt }}-mutation_rust
          path: .build/ci-evidence/mutation-rust
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  mutation_ci:
    name: Mutation CI full
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - run: npm ci --prefix scripts/ci --omit=peer --ignore-scripts
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/gates.mjs context --out .build/ci-evidence/mutation_ci/context.json --job mutation_ci
      - name: Run fresh CI-helper mutation
        run: node scripts/ci/run-mutation.mjs ci --profile full --root .build/ci-evidence/mutation_ci/mutation-ci
      - name: Normalize available mutation evidence
        if: always()
        run: node scripts/ci/gates.mjs record-mutation --root .build/ci-evidence/mutation_ci --gate mutation-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: evidence-${{ github.run_id }}-${{ github.run_attempt }}-mutation_ci
          path: .build/ci-evidence/mutation_ci
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  report:
    name: Mutation full report
    if: always()
    needs:
      - mutation_rust
      - mutation_ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - run: npm ci --prefix scripts/ci --omit=peer --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          pattern: evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .build/collected
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/gates.mjs mutation-summary --root .build/collected --out .build/full-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: full-mutation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/full-report
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
