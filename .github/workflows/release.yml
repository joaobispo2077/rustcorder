name: Controlled release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [release]
  workflow_dispatch:
    inputs:
      source_run_id:
        type: string
        description: Read-only preview source CI run
      source_run_attempt:
        type: string
        default: "1"
      source_sha:
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  preview:
    name: Route verified release evidence
    if: >-
      github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.id == github.repository_id) || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      state: ${{ steps.route.outputs.state }}
      intent_artifact_id: ${{ steps.route.outputs.intent_artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - run: npm ci --prefix scripts/ci --omit=peer --ignore-scripts
      - id: route
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node scripts/ci/release-automation.mjs route --out .build/route
  prepare:
    name: Prepare automatic release metadata
    needs: preview
    if: needs.preview.outputs.state == 'source'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      state: ${{ steps.prepare.outputs.state }}
      artifact_id: ${{ steps.prepare.outputs.artifact_id || steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - run: npm ci --prefix scripts/ci --omit=peer --ignore-scripts
      - name: Provision pinned Cargo environment
        shell: pwsh
        run: ./scripts/ci/setup-windows.ps1 -Install
      - id: prepare
        name: Freeze verified preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/release-automation.mjs prepare --out .build/preparation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: artifact
        name: Persist verified preparation
        if: steps.prepare.outputs.state == 'prepared' && steps.prepare.outputs.reused != 'true'
        with:
          name: preparation-${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/preparation
          if-no-files-found: error
          retention-days: 14
  metadata:
    name: Write bounded release metadata
    needs: [preview, prepare]
    if: needs.prepare.outputs.state == 'prepared'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    concurrency:
      group: release-metadata-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - run: npm ci --prefix scripts/ci --omit=peer --ignore-scripts
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Create exact metadata objects
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WRITE_TOKEN: ${{ steps.app.outputs.token || secrets.GH_TOKEN }}
          RELEASE_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          PREPARATION_ARTIFACT_ID: ${{ needs.prepare.outputs.artifact_id }}
        run: node scripts/ci/release-automation.mjs metadata --out .build/metadata
      - name: Persist metadata intent
        id: intent
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: metadata-${{ steps.metadata.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/metadata/metadata-intent.json
          if-no-files-found: error
          retention-days: 14
      - name: Advance existing release ref
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WRITE_TOKEN: ${{ steps.app.outputs.token || secrets.GH_TOKEN }}
          INTENT_ARTIFACT_ID: ${{ steps.intent.outputs.artifact-id }}
          INTENT_ARTIFACT_DIGEST: sha256:${{ steps.intent.outputs.artifact-digest }}
        run: node scripts/ci/release-automation.mjs advance --out .build/metadata
  preflight:
    name: Freeze automatic publication candidate
    needs: preview
    if: needs.preview.outputs.state == 'final'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - run: npm ci --prefix scripts/ci --omit=peer --ignore-scripts
      - env:
          GH_TOKEN: ${{ github.token }}
          INTENT_ARTIFACT_ID: ${{ needs.preview.outputs.intent_artifact_id }}
        run: node scripts/ci/release-automation.mjs preflight --out .build/candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: candidate
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/candidate
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish verified automatic candidate
    needs: [preview, preflight]
    if: needs.preview.outputs.state == 'final'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-publication-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - run: npm ci --prefix scripts/ci --omit=peer --ignore-scripts
      - env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.preflight.outputs.artifact_id }}
        run: node scripts/ci/release-automation.mjs publish --out .build/publication
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/publication
          if-no-files-found: warn
          retention-days: 14
